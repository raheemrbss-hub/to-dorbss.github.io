<!DOCTYPE html>
<html>

<head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="todo-container">
        <!-- App Header & Hero Area -->
        <header class="app-header">
            <h1>Task Buddy 1</h1>
            <p>Keep track of your daily checklist cleanly.</p>
        </header>
        <div class="header-panel">
            <div>Total:  <span id="totalCount" class="counter-span">0</span></div>
            <div>Completed: <span id="completedCount" class="counter-span">0</span></div>
        </div>

        <div class="input-section">
            <input type="text" id="new-task-input" placeholder="Add a new task...">
            <button id="add-button">Add</button>
        </div>

        <div class="filter-tabs">
            <button id="all-button" class="active">All</button>
            <button id="active-button">Active</button>
            <button id="completed-button">Completed</button>
            <button id="dlt-all">Delete All</button>
        </div>

        <ul class="content-div">
            <!-- JS mounts individual .list <li> items here -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
